{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTalk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'testApp/css/home.css' %}">
</head>
<body>
    <main class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card login-card shadow-sm p-4 p-md-5">

            <div class="text-center mb-4">
                <img
                    src="{% static 'testApp/images/logo.png' %}"
                    alt="UniTalk"
                    class="login-logo"
                >
                <p class="login-subtitle mb-0">
                    Welcome back! Please sign in to continue.
                </p>
            </div>


            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                <input
                    type="hidden"
                    name="next"
                    value="{% url 'feed' %}"
                >

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Your username or password was incorrect.
                        Please try again.
                    </div>
                {% endif %}

                <div class="mb-3">
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    {{ form.password }}
                </div>

                <button type="submit" class="btn btn-primary w-100 login-button">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="mb-2">
                    Don't have an account?
                </p>
                <p> <a href="{% url 'register' %}" class="text-decoration-none">
                    Create an account
                </a>
                </p>
                <a href="{% url 'password_reset' %}" class="text-decoration-none">
                    Forgot password?
                </a>
            </div>

        </div>
    </main>
</body>
</html>
