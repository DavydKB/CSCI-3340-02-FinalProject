<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
</head>
<body>
    <h1>All Posts</h1>

    {% for post in posts %}
        <p>
            {{ post.title }}
            {{ post.date_created }}
        </p>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}
</body>
</html>
