<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
</head>
<header>
    <nav>
        <a href="{% url 'feed' %}">Home</a>
        <a href="{% url 'profile_page' %}">Profile</a>
        <a href="{% url 'event_page' %}">Events</a>
    </nav>
</header>
<body>
    <h1>All Posts</h1>

    {% for post in posts %}
        <p>
            {{ post.title }}
            {{ post.date_created }}
        </p>
    {% empty %}
        <p>No posts yet.</p>
    {% endfor %}

    <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>
</body>
</html>
